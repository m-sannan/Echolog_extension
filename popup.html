<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EchoLog</title>
  <style>
    :root {
      --bg-body: #F4F5F2;
      --bg-panel: #FFFFFF;
      --primary-dark: #1F3615;
      --primary-light: #9EF073;
      --secondary-bg: #EDF2EB;
      --text-main: #1C2317;
      --text-muted: #6C7667;
      --border-light: #E4E7E1;
      --border-radius-lg: 24px;
      --border-radius-md: 16px;
      --border-radius-pill: 9999px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 800px;
      height: 550px;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-body);
      color: var(--text-main);
      box-sizing: border-box;
      gap: 16px;
    }

    header {
      background-color: var(--bg-panel);
      border-radius: var(--border-radius-pill);
      display: flex;
      align-items: center;
      padding: 8px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      color: var(--primary-dark);
      padding-right: 16px;
      border-right: 1px solid var(--border-light);
    }
    
    .top-tabs {
      display: flex;
      gap: 8px;
      margin-left: 16px;
    }
    
    .top-tab {
      padding: 6px 16px;
      border-radius: var(--border-radius-pill);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .top-tab.active {
      background-color: var(--primary-light);
      color: var(--primary-dark);
    }
    .top-tab:hover:not(.active) {
      background-color: var(--secondary-bg);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    #search-bar {
      flex: 1;
      padding: 12px 20px;
      border: 1px solid var(--border-light);
      border-radius: var(--border-radius-pill);
      font-size: 13px;
      font-weight: 500;
      outline: none;
      background: var(--bg-panel);
      transition: border-color 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }
    #search-bar:focus { border-color: var(--primary-light); }
    
    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: var(--bg-panel);
      padding: 10px 16px;
      border-radius: var(--border-radius-pill);
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }
    
    .toolbar-btn {
      background: var(--bg-panel);
      border: none;
      border-radius: var(--border-radius-pill);
      padding: 10px 20px;
      cursor: pointer;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }
    .toolbar-btn:hover { background: var(--secondary-bg); }
    
    .main-container {
      display: flex;
      flex: 1;
      gap: 16px;
      overflow: hidden;
    }
    
    .log-list {
      width: 40%;
      background: var(--bg-panel);
      border-radius: var(--border-radius-lg);
      overflow-y: auto;
      position: relative;
      padding: 12px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }
    
    .timeline-bg {
      position: absolute;
      left: 82px;
      top: 0; bottom: 0;
      width: 2px;
      background-color: var(--secondary-bg);
      z-index: 1;
    }
    
    .log-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: all 0.2s;
      margin: 4px 12px;
      border-radius: var(--border-radius-md);
    }
    .log-item.active { background-color: var(--primary-dark); }
    .log-item:hover:not(.active) { background-color: var(--secondary-bg); }
    
    .time {
      width: 50px;
      text-align: right;
      color: var(--text-muted);
      font-size: 11px;
      margin-right: 12px;
      flex-shrink: 0;
      font-weight: 600;
    }
    .log-item.active .time { color: rgba(255,255,255,0.7); }
    
    .timeline-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background-color: var(--primary-light);
      margin-right: 12px;
      flex-shrink: 0;
      border: 2px solid var(--bg-panel);
    }
    .log-item.active .timeline-dot { background-color: var(--primary-light); border-color: var(--primary-dark); }
    .log-item:hover:not(.active) .timeline-dot { border-color: var(--secondary-bg); }
    
    .log-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .log-item.active .log-title { color: #ffffff; }
    
    .divider {
      background: var(--secondary-bg);
      color: var(--primary-dark);
      font-size: 10px;
      padding: 6px 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: var(--border-radius-pill);
      margin: 12px 16px;
      position: relative;
      z-index: 2;
      text-align: center;
    }
    
    .details-panel {
      width: 60%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel);
      border-radius: var(--border-radius-lg);
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }
    
    .details-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .details-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-dark);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .icon-btn {
      background: var(--secondary-bg);
      border: none;
      cursor: pointer;
      color: var(--primary-dark);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--border-radius-pill);
      transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--primary-light); }
    
    .content-area {
      flex: 1;
      padding: 24px;
      overflow: auto;
      font-size: 13px;
    }
    
    .code-view {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
      background: var(--bg-body);
      padding: 20px;
      border-radius: var(--border-radius-md);
      color: var(--text-main);
    }
    
    .header-section { margin-bottom: 24px; }
    .header-section h4 {
      margin: 0 0 12px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
    }
    
    .header-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-light);
    }
    .header-row:last-child { border-bottom: none; }
    
    .header-key {
      width: 140px;
      color: var(--text-muted);
      font-weight: 600;
      flex-shrink: 0;
    }
    .header-value {
      color: var(--text-main);
      word-break: break-all;
      font-weight: 600;
    }
    
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
    }

    /* Modals */
    .modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(31, 54, 21, 0.4);
      display: none; justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg-panel); padding: 32px; border-radius: var(--border-radius-lg); width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 16px;
    }
    .modal h3 { margin: 0; font-size: 20px; font-weight: 800; color: var(--primary-dark); }
    .modal p { font-size: 13px; font-weight: 500; color: var(--text-muted); margin: 0; }
    .modal textarea {
      width: 100%; height: 120px; padding: 16px; border: 1px solid var(--border-light); border-radius: var(--border-radius-md);
      font-family: inherit; font-size: 13px; box-sizing: border-box; outline: none; background: var(--bg-body);
      font-weight: 500;
    }
    .modal textarea:focus { border-color: var(--primary-light); background: var(--bg-panel); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
    .btn { padding: 10px 24px; border: none; border-radius: var(--border-radius-pill); cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.2s; }
    .btn-primary { background: var(--primary-dark); color: white; }
    .btn-primary:hover { background: #15260f; }
    .btn-secondary { background: var(--secondary-bg); color: var(--primary-dark); }
    .btn-secondary:hover { background: #dfe8db; }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">
      <img src="echolog_logo.png" alt="EchoLog Logo" width="22" height="22" style="border-radius: 4px; object-fit: contain;">
      EchoLog
    </div>
    <div class="top-tabs">
      <div class="top-tab active" data-tab="headers">Headers</div>
      <div class="top-tab" data-tab="payload">Payload</div>
      <div class="top-tab" data-tab="preview">Preview</div>
      <div class="top-tab" data-tab="response">Response</div>
    </div>
  </header>
  
  <div class="toolbar">
    <input type="text" id="search-bar" placeholder="Filter by endpoint...">
    <button class="toolbar-btn" id="clear-logs">Clear</button>
    <label class="filter-label" title="Only show XHR and Fetch requests">
      <input type="checkbox" id="xhr-filter" checked>
      API Only
    </label>
    <button class="toolbar-btn" id="open-settings">Domains</button>
  </div>

  <div class="main-container">
    <div class="log-list" id="log-list">
      <div class="timeline-bg"></div>
      <div class="empty-state">No requests captured yet</div>
    </div>

    <div class="details-panel">
      <div class="details-header" id="details-header" style="display: none;">
        <h2 class="details-title" id="details-title">Select an event</h2>
        <div class="details-actions">
          <button class="icon-btn" id="copy-btn" title="Copy Current View">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <div class="content-area" id="detail-content">
        <div class="empty-state">Waiting for selection...</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h3>Tracked Domains</h3>
      <p>Enter domains to monitor (one per line).</p>
      <textarea id="domains-input" placeholder="localhost&#10;example.com"></textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="close-settings">Cancel</button>
        <button class="btn btn-primary" id="save-settings">Save</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
